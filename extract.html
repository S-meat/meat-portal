<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="assets/fit.js"></script>
<meta name="theme-color" content="#f5f5f2">
<title>作業指示書・バランス照会の取り込み｜MEAT LINK</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="app-head">
  <div class="brand">
    <img class="logo" src="assets/logo.png" width="584" height="610" alt="SAIBOKU" decoding="async">
    <div><small>SAIBOKU 製造部</small><b>作業指示書・バランス照会の取り込み</b></div>
    <span class="spacer"></span>
    <a class="pill line" href="manual-admin.html" style="text-decoration:none">マニュアル</a>
    <a class="pill line" href="index.html#plan" style="text-decoration:none">共有アプリへ</a>
  </div>
</header>

<div class="wrap">
  <div class="rules">
    <div><i>01</i><b>ファイルを選ぶ</b>作業指示書とバランス照会（.xlsx）を選ぶかドラッグ。2つ同時でも、どちらか1つでもOKです。</div>
    <div><i>02</i><b>内容を確認</b>下にプレビューが出ます。メンバーが見る画面と同じです。</div>
    <div><i>03</i><b>共有する</b>暗証番号を入れて共有。同じ日付を取り込み直すと上書きされます。</div>
  </div>

  <div class="card">
    <h2><span class="num">01</span>作業指示書・バランス照会を選ぶ</h2>
    <label class="drop" id="drop">
      <b>ここにファイルをドロップ</b>
      <span class="muted">2つまとめてドロップできます／タップして選択（.xlsx / .xlsm）</span>
      <input type="file" id="file" multiple accept=".xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    </label>
    <div id="parseMsg"></div>
    <div id="loaded" class="loaded"></div>
  </div>

  <div class="card">
    <h2><span class="num">GIFT</span>ギフト予定を貼り付け（ファイルがないとき）</h2>
    <p class="muted" style="margin:0 0 8px">バランス照会のExcelで、日付の見出し行から品目の行まで選んでコピーし、ここに貼り付けます。「ｷﾞﾌﾄ」の付く品目だけを読み取ります。</p>
    <textarea id="giftText" rows="4" placeholder="ここに貼り付け" style="width:100%;box-sizing:border-box;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px"></textarea>
  </div>

  <div class="card" id="shareCard" hidden>
    <h2><span class="num">02</span>共有する</h2>
    <div id="summary" class="muted"></div>
    <div class="field" id="pinRow">
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="暗証番号">
    </div>
    <button class="btn block" id="share">この内容で共有する</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn sub" id="dl" style="flex:1">JSONを保存</button>
    </div>
    <div id="shareMsg"></div>
  </div>

  <div id="preview"></div>
  <div id="giftPreview"></div>
</div>

<!-- GAS への送信（hidden form + iframe：CORS 回避） -->
<iframe name="gasFrame" id="gasFrame" hidden></iframe>
<form id="gasForm" method="post" target="gasFrame" hidden>
  <input type="hidden" name="pin">
  <input type="hidden" name="payload">
  <input type="hidden" name="kind">
  <input type="hidden" name="notify">
</form>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/parser.js"></script>
<script src="assets/render.js"></script>
<script src="assets/gift.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.PORTAL_CONFIG || {};
  var plan = null, gift = null, planName = '', giftName = '';
  var $ = function (id) { return document.getElementById(id); };
  var esc = PlanView.esc;
  function msg(el, cls, html) { $(el).innerHTML = html ? '<div class="msg ' + cls + '">' + html + '</div>' : ''; }
  var store = {
    get: function (k) { try { return localStorage.getItem('meatPortal.' + k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem('meatPortal.' + k, v); } catch (e) {} }
  };
  $('pin').value = store.get('pin');

  if (!CFG.GAS_URL) {
    $('pinRow').hidden = true;
    $('share').disabled = true;
    $('share').textContent = 'GAS未設定のため共有できません（JSON保存のみ）';
  }

  // ---------- ファイル読み込み ----------
  // ページのどこに落としても受け付ける（ブラウザがファイルを開いてしまうのも防ぐ）
  var drop = $('drop'), dragDepth = 0;
  function hasFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    return t && Array.prototype.indexOf.call(t, 'Files') >= 0;
  }
  window.addEventListener('dragenter', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth++; document.body.classList.add('dragging');
  });
  window.addEventListener('dragover', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  });
  window.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) document.body.classList.remove('dragging');
  });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    handleFiles(e.dataTransfer.files);
  });
  $('file').addEventListener('change', function (e) { handleFiles(e.target.files); e.target.value = ''; });

  // 複数ファイルを順に読む。作業指示書かバランス照会かは中身で自動判定
  function handleFiles(list) {
    var files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    msg('parseMsg', '', ''); msg('shareMsg', '', '');
    if (typeof XLSX === 'undefined') { msg('parseMsg', 'err', '読み取りライブラリを読み込めませんでした。ネット接続を確認してください。'); return; }
    var errs = [];
    (function next(i) {
      if (i >= files.length) {
        if (errs.length) msg('parseMsg', 'err', errs.join('<br>'));
        update();
        return;
      }
      var file = files[i];
      if (!/\.(xlsx|xlsm)$/i.test(file.name)) { errs.push('Excelファイル（.xlsx / .xlsm）ではありません：' + esc(file.name)); next(i + 1); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = new Uint8Array(reader.result);
          var wb = XLSX.read(data, { type: 'array' });
          if (GiftParser.isGiftWorkbook(wb)) { gift = GiftParser.fromWorkbook(XLSX, wb, { fileName: file.name }); giftName = file.name; }
          else { plan = PlanParser.parseWorkbook(XLSX, data, file.name); planName = file.name; }
        } catch (err) {
          errs.push('読み取れませんでした（' + esc(file.name) + '）：' + esc(err.message));
        }
        next(i + 1);
      };
      reader.onerror = function () { errs.push('開けませんでした：' + esc(file.name)); next(i + 1); };
      reader.readAsArrayBuffer(file);
    })(0);
  }

  // 読み込み状況・まとめ・プレビューを描き直す
  function update() {
    var rows = [];
    rows.push('<div class="ld' + (plan ? ' on' : '') + '"><b>作業指示書</b><span>' + (plan ? esc(planName) + '（' + PlanView.jpDate(plan.date) + '）' : '未選択') + '</span>' + (plan ? '<button data-clear="plan" aria-label="外す">×</button>' : '') + '</div>');
    rows.push('<div class="ld' + (gift ? ' on' : '') + '"><b>バランス照会</b><span>' + (gift ? esc(giftName) + '（' + gift.items.length + '品目）' : '未選択') + '</span>' + (gift ? '<button data-clear="gift" aria-label="外す">×</button>' : '') + '</div>');
    $('loaded').innerHTML = rows.join('');
    [].forEach.call($('loaded').querySelectorAll('[data-clear]'), function (b) {
      b.onclick = function () { if (b.getAttribute('data-clear') === 'plan') plan = null; else gift = null; msg('shareMsg', '', ''); update(); };
    });
    var sum = [];
    if (plan) {
      var n = plan.naizo, p = plan.pack;
      sum.push('作業日 <b style="color:var(--ink);font-size:16px">' + PlanView.jpDate(plan.date) + '</b>' +
        '　内臓 ' + n.staff.length + '名・商品 ' + n.products.length + '件　精肉パック ' + p.staff.length + '名' +
        '　当日分 ' + plan.today.total + '　翌日分 ' + plan.next.total);
    }
    if (gift) {
      sum.push('ギフト予定 <b style="color:var(--ink);font-size:16px">' + gift.items.length + '品目</b>（投稿日の2日後から7日分を表示。前回のギフト予定は置き換わります）');
    }
    $('summary').innerHTML = sum.join('<br>');
    $('shareCard').hidden = !(plan || gift);
    $('share').textContent = shareLabel();
    if (plan) PlanView.render($('preview'), plan, {}); else $('preview').innerHTML = '';
    $('giftPreview').innerHTML = gift ? PlanView.giftHTML(gift, 'done') : '';
  }
  function shareLabel() {
    return plan && gift ? '作業指示書とギフト予定をまとめて共有する' : gift ? 'ギフト予定を共有する' : 'この内容で共有する';
  }

  var giftTimer = null;
  $('giftText').addEventListener('input', function () {
    clearTimeout(giftTimer);
    giftTimer = setTimeout(function () {
      var t = $('giftText').value;
      if (!t.trim()) return;
      msg('shareMsg', '', ''); msg('parseMsg', '', '');
      try {
        gift = GiftParser.fromText(t, { fileName: '貼り付け' }); giftName = '貼り付けた表';
      } catch (err) {
        gift = null;
        msg('parseMsg', 'err', 'ギフト予定を読み取れませんでした：' + esc(err.message) + '<br>日付の見出し行（例：11／22日）も含めてコピーしてください。');
      }
      update();
    }, 300);
  });

  // ---------- 共有 ----------
  // 作業指示書・ギフト予定を1件ずつ順番に送る（同じ iframe を使うため）
  var waiting = null, queue = [], results = [];
  window.addEventListener('message', function (e) {
    var d = e.data && e.data.meatPortal;
    if (!d || !waiting) return;
    finish(d);
  });

  function sendNext() {
    var job = queue.shift();
    if (!job) { done(); return; }
    var f = $('gasForm');
    f.action = CFG.GAS_URL;
    f.pin.value = $('pin').value.trim();
    f.payload.value = JSON.stringify(job.data);
    f.kind.value = job.kind === 'gift' ? 'gift' : '';
    // #110 への更新通知は最後の1件で、先に保存できた分とまとめて1回だけ送る
    f.notify.value = queue.length ? '0' : JSON.stringify(results.filter(function (r) { return r.res.ok; }).map(function (r) {
      return r.job.kind === 'gift' ? { kind: 'gift' } : { kind: 'plan', date: r.job.data.date };
    }));
    var startedAt = Date.now();
    waiting = { job: job, timer: setTimeout(function () { if (job.kind === 'gift') verifyGift(startedAt); else verifyByList(job.data.date, startedAt); }, 8000) };
    f.submit();
  }

  function finish(d) {
    if (!waiting) return;
    clearTimeout(waiting.timer);
    var job = waiting.job;
    waiting = null;
    results.push({ job: job, res: d });
    if (!d.ok) queue = [];   // 暗証番号違いなどは残りも同じ結果になるので止める
    // 2件目は1件目の画面遷移が落ち着いてから送る
    setTimeout(sendNext, d.ok ? 600 : 0);
  }

  function done() {
    $('share').disabled = false;
    $('share').textContent = shareLabel();
    var ok = [], ng = [];
    results.forEach(function (r) {
      var what = r.job.kind === 'gift' ? 'ギフト予定' : PlanView.jpDate(r.job.data.date) + ' の作業予定';
      if (r.res.ok) ok.push(what); else ng.push(what + '：' + esc(r.res.error || ''));
    });
    if (ok.length) store.set('pin', $('pin').value);
    var html = '';
    if (ok.length) html += '<div class="msg ok">' + ok.join('と') + 'を共有しました。<a href="index.html#plan">共有アプリで見る</a>' + (results.some(function (r) { return r.res.ok && r.job.kind === 'gift'; }) ? '（ギフトは 明日の予定 →「ギフト」）' : '') + '</div>';
    if (ng.length) html += '<div class="msg err">共有できませんでした：' + ng.join('<br>') + '</div>';
    $('shareMsg').innerHTML = html;
  }

  // postMessage が届かない環境向け：一覧に日付が入ったかで確認
  function verifyByList(date, startedAt) {
    var cb = 'mp_v_' + Date.now();
    var s = document.createElement('script');
    window[cb] = function (res) {
      delete window[cb]; s.remove();
      var hit = (res.dates || []).filter(function (x) { return x.date === date && new Date(x.updatedAt).getTime() >= startedAt - 60000; })[0];
      finish(hit ? { ok: true, date: date } : { ok: false, error: '保存を確認できませんでした。暗証番号を確認してもう一度お試しください。' });
    };
    s.onerror = function () { finish({ ok: false, error: '通信エラー' }); };
    s.src = CFG.GAS_URL + '?action=list&key=' + encodeURIComponent($('pin').value.trim()) + '&callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
  }
  function verifyGift(startedAt) {
    var cb = 'mp_g_' + Date.now();
    var s = document.createElement('script');
    window[cb] = function (res) {
      delete window[cb]; s.remove();
      var g = res && res.gift;
      var ok = g && new Date(g.updatedAt).getTime() >= startedAt - 60000;
      finish(ok ? { ok: true, kind: 'gift' } : { ok: false, error: '保存を確認できませんでした。暗証番号を確認してもう一度お試しください。' });
    };
    s.onerror = function () { finish({ ok: false, error: '通信エラー' }); };
    s.src = CFG.GAS_URL + '?action=gift&key=' + encodeURIComponent($('pin').value.trim()) + '&callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
  }

  $('share').onclick = function () {
    if ((!plan && !gift) || !CFG.GAS_URL || waiting) return;
    if (!$('pin').value.trim()) { msg('shareMsg', 'err', '暗証番号を入れてください'); return; }
    queue = []; results = [];
    if (plan) queue.push({ kind: 'plan', data: plan });
    if (gift) queue.push({ kind: 'gift', data: gift });
    $('share').disabled = true;
    $('share').textContent = '送信中…';
    msg('shareMsg', '', '');
    sendNext();
  };

  $('dl').onclick = function () {
    if (!plan && !gift) return;
    var blob = new Blob([JSON.stringify(plan && gift ? { plan: plan, gift: gift } : (gift || plan), null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = plan && gift ? 'plan-gift-' + plan.date + '.json' : gift ? 'gift-' + gift.dates[0].date + '.json' : 'plan-' + plan.date + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
})();
</script>
</body>
</html>
