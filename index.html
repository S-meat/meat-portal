<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MEAT LINK">
<meta name="application-name" content="MEAT LINK">
<link rel="manifest" href="manifest.webmanifest">
<title>MEAT LINK｜ミートチーム</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-head" id="head">
  <div class="brand">
    <img class="logo" src="assets/logo.png" width="584" height="610" alt="SAIBOKU" decoding="async">
    <div><small>SAIBOKU 製造部</small><b>MEAT LINK</b></div>
    <span class="spacer"></span>
    <a class="pill line" href="manual.html" style="text-decoration:none">使い方</a>
  </div>
  <nav class="seg" role="tablist" id="tabs">
    <button role="tab" data-tab="plan"><span class="long">明日の作業予定</span><span class="short">明日の予定</span></button>
    <button role="tab" data-tab="kaizen">現場改善</button>
    <button role="tab" data-tab="shift">シフト変更</button>
    <button role="tab" data-tab="kyuka">希望休</button>
  </nav>
</header>

<!-- 明日の作業予定 -->
<main class="view" id="view-plan">
  <div class="wrap">
    <div class="datebar">
      <button class="icon-btn" id="prev" aria-label="前の日">‹</button>
      <div class="d" id="dlabel"></div>
      <button class="icon-btn" id="next" aria-label="次の日">›</button>
    </div>
    <div id="planBody"><div class="state"><div class="spinner"></div>読み込み中…</div></div>
    <p class="muted" style="text-align:center;margin-top:24px">
      <a href="manual.html">使い方ガイド</a>　／　<a href="extract.html">作業指示書を取り込む（担当者用）</a>
    </p>
  </div>
</main>

<!-- 既存アプリ（iframe） -->
<section class="frame-view" id="view-kaizen" data-link="kaizen" data-title="現場改善フォーム"></section>
<section class="frame-view" id="view-shift" data-link="shift" data-title="シフト変更申請"></section>
<section class="frame-view" id="view-kyuka" data-link="kyuka" data-title="希望休申請"></section>

<script src="assets/config.js"></script>
<script src="assets/render.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.PORTAL_CONFIG || {};
  var TABS = ['plan', 'kaizen', 'shift', 'kyuka'];
  var store = {
    get: function (k) { try { return localStorage.getItem('meatPortal.' + k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem('meatPortal.' + k, v); } catch (e) {} }
  };

  // ---------- ヘッダー高さ（iframe の位置合わせ） ----------
  var head = document.getElementById('head');
  function syncHead() { document.documentElement.style.setProperty('--head-h', head.offsetHeight + 'px'); }
  syncHead();
  window.addEventListener('resize', syncHead);

  // ---------- タブ ----------
  function openTab(name) {
    if (TABS.indexOf(name) < 0) name = 'plan';
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === name);
    });
    TABS.forEach(function (t) {
      document.getElementById('view-' + t).classList.toggle('active', t === name);
    });
    document.body.style.overflow = name === 'plan' ? '' : 'hidden';
    if (name !== 'plan') loadFrame(document.getElementById('view-' + name));
    if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
    syncHead();
  }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) openTab(b.getAttribute('data-tab'));
  });
  window.addEventListener('hashchange', function () { openTab(location.hash.slice(1)); });

  // 一度開いたら保持（切り替えても入力途中が消えない）
  function loadFrame(sec) {
    if (sec.getAttribute('data-loaded')) return;
    sec.setAttribute('data-loaded', '1');
    var url = (CFG.LINKS || {})[sec.getAttribute('data-link')] || '';
    var openUrl = url.replace(/([?&])embedded=true&?/, '$1').replace(/[?&]$/, '');
    sec.innerHTML =
      '<div class="frame-bar"><span>' + PlanView.esc(sec.getAttribute('data-title')) + '</span>' +
      '<a href="' + PlanView.esc(openUrl) + '" target="_blank" rel="noopener">表示されない時は別タブで開く ↗</a></div>' +
      '<div class="frame-loading">読み込み中…</div>' +
      '<iframe src="' + PlanView.esc(url) + '" title="' + PlanView.esc(sec.getAttribute('data-title')) + '" allow="clipboard-write"></iframe>';
    sec.querySelector('iframe').addEventListener('load', function () {
      var l = sec.querySelector('.frame-loading'); if (l) l.remove();
    });
  }

  // ---------- 作業予定の読み込み ----------
  var dates = [], current = '';
  var planEl = document.getElementById("planBody");

  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var cb = 'mp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var s = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('タイムアウトしました')); }, 20000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = function (data) { cleanup(); resolve(data); };
      s.onerror = function () { cleanup(); reject(new Error('通信エラー')); };
      s.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + cb + '&_=' + Date.now();
      document.body.appendChild(s);
    });
  }

  function fetchPlan(date) {
    if (!CFG.GAS_URL) {
      // デモ：_demo/sample-plan.js（ダブルクリックで開いても読めるよう script で読み込む）
      return new Promise(function (resolve, reject) {
        function done() {
          var plan = window.SAMPLE_PLAN;
          if (!plan) { reject(new Error('GAS_URL が未設定です（assets/config.js）')); return; }
          resolve({ ok: true, date: plan.date, plan: plan, dates: [{ date: plan.date, updatedAt: plan.extractedAt }] });
        }
        if (window.SAMPLE_PLAN) { done(); return; }
        var s = document.createElement('script');
        s.src = '_demo/sample-plan.js';
        s.onload = done;
        s.onerror = done;
        document.body.appendChild(s);
      });
    }
    return jsonp(CFG.GAS_URL + '?action=get' + (date ? '&date=' + encodeURIComponent(date) : ''));
  }

  function setLabel(plan) {
    var el = document.getElementById('dlabel');
    if (!current) { el.innerHTML = '<b>作業予定</b>'; return; }
    var r = PlanView.relDay(current);
    var upd = plan && (plan.updatedAt || plan.extractedAt);
    var t = '';
    if (upd) { var d = new Date(upd); t = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + ' 更新'; }
    el.innerHTML = '<b>' + PlanView.jpDate(current) + '</b><span class="rel' + (r.past ? ' past' : '') + '">' + r.t + '</span>' +
      '<span class="muted">' + t + '</span>';
    var i = dates.indexOf(current);
    document.getElementById('prev').disabled = i <= 0;
    document.getElementById('next').disabled = i < 0 || i >= dates.length - 1;
  }

  function load(date) {
    planEl.innerHTML = '<div class="state"><div class="spinner"></div>読み込み中…</div>';
    fetchPlan(date).then(function (res) {
      if (!res.ok) throw new Error(res.error || '読み込みに失敗しました');
      dates = (res.dates || []).map(function (d) { return d.date; });
      current = res.date || '';
      setLabel(res.plan);
      if (!res.plan) {
        planEl.innerHTML = '<div class="state"><b>作業予定がまだありません</b>作業指示書が取り込まれると、ここに表示されます。</div>';
        return;
      }
      PlanView.render(planEl, res.plan, {
        me: store.get('me'),
        section: store.get('section') || 'naizo',
        onMeChange: function (v) { store.set('me', v); },
        onSection: function (v) { store.set('section', v); }
      });
    }).catch(function (err) {
      planEl.innerHTML = '<div class="state"><b>読み込めませんでした</b>' + PlanView.esc(err.message) +
        '<br><br><button class="btn sub" id="retry">再読み込み</button></div>';
      document.getElementById('retry').onclick = function () { load(current); };
    });
  }

  document.getElementById('prev').onclick = function () { var i = dates.indexOf(current); if (i > 0) load(dates[i - 1]); };
  document.getElementById('next').onclick = function () { var i = dates.indexOf(current); if (i >= 0 && i < dates.length - 1) load(dates[i + 1]); };

  openTab(location.hash.slice(1) || 'plan');
  load('');
})();
</script>
</body>
</html>
